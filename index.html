<title>ayisha and rohan</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {

        font-family: 'Inter', sans-serif;

        background: #050505;
        color: white;

        overflow-x: hidden;
    }

    /* ---------------- HERO SECTION ---------------- */

    .hero {

        position: relative;

        height: 100vh;
        overflow: hidden;
    }

    /* ---------------- IMAGE SLIDER ---------------- */

    .slider {

        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;
    }

    .slides {

        display: flex;

        width: 600%;
        height: 100%;

        animation: slide 36s infinite ease-in-out;
    }

    .slides img {

        width: 100vw;
        height: 100vh;

        object-fit: cover;

        flex-shrink: 0;

        filter: brightness(0.5);
    }

    @keyframes slide {

        0% {
            transform: translateX(0vw);
        }

        14% {
            transform: translateX(0vw);
        }

        18% {
            transform: translateX(-100vw);
        }

        32% {
            transform: translateX(-100vw);
        }

        36% {
            transform: translateX(-200vw);
        }

        50% {
            transform: translateX(-200vw);
        }

        54% {
            transform: translateX(-300vw);
        }

        68% {
            transform: translateX(-300vw);
        }

        72% {
            transform: translateX(-400vw);
        }

        86% {
            transform: translateX(-400vw);
        }

        90% {
            transform: translateX(-500vw);
        }

        100% {
            transform: translateX(-500vw);
        }
    }

    /* ---------------- DARK OVERLAY ---------------- */

    .overlay {

        position: absolute;
        inset: 0;

        background:
            linear-gradient(
                rgba(0,0,0,0.45),
                rgba(0,0,0,0.78)
            );

        z-index: 1;
    }

    /* ---------------- HERO CONTENT ---------------- */

    .hero-content {

        position: relative;

        z-index: 2;

        width: 100%;
        height: 100%;

        display: flex;
        flex-direction: column;

        justify-content: center;
        align-items: center;

        text-align: center;

        padding: 20px;
    }

    h1 {

        font-size: clamp(4rem, 10vw, 8rem);

        font-weight: 700;

        letter-spacing: -4px;

        margin-bottom: 15px;
    }

    .subtitle {

        color: #d1d5db;

        font-size: 1rem;

        letter-spacing: 2px;

        margin-bottom: 35px;
    }

    /* ---------------- CUSTOM TEXT BOX ---------------- */

    .custom-text {

        max-width: 700px;

        padding: 20px 28px;

        border-radius: 24px;

        background: rgba(255,255,255,0.06);

        backdrop-filter: blur(14px);

        border: 1px solid rgba(255,255,255,0.08);

        color: #e5e7eb;

        font-size: 1rem;

        line-height: 1.9;

        box-shadow: 0 0 40px rgba(0,0,0,0.25);
    }

    /* ---------------- SCROLL TEXT ---------------- */

    .scroll-text {

        position: absolute;

        bottom: 35px;

        color: rgba(255,255,255,0.7);

        font-size: 0.9rem;

        letter-spacing: 2px;

        animation: float 2s infinite ease-in-out;
    }

    @keyframes float {

        0% {
            transform: translateY(0px);
        }

        50% {
            transform: translateY(8px);
        }

        100% {
            transform: translateY(0px);
        }
    }

    /* ---------------- MESSAGE SECTION ---------------- */

    .message-section {

        min-height: 100vh;

        background: #050505;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 100px 25px;
    }

    .message-box {

        max-width: 950px;

        text-align: center;
    }

    .message-box h2 {

        font-size: clamp(2.5rem, 6vw, 5rem);

        margin-bottom: 30px;

        line-height: 1.1;

        letter-spacing: -2px;
    }

    .message-box p {

        color: #9ca3af;

        font-size: 1.15rem;

        line-height: 2;
    }

    /* ---------------- EXTRA TEXT SECTION ---------------- */

    .extra-section {

        min-height: 100vh;

        background: black;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 100px 25px;
    }

    .extra-box {

        max-width: 800px;

        text-align: center;
    }

    .extra-box h3 {

        font-size: clamp(2rem, 5vw, 4rem);

        margin-bottom: 25px;

        letter-spacing: -2px;
    }

    .extra-box p {

        color: #a1a1aa;

        font-size: 1.1rem;

        line-height: 2;
    }

    /* ---------------- MOBILE ---------------- */

    @media (max-width: 900px) {

        h1 {
            font-size: 4rem;
        }

        .subtitle {
            font-size: 0.85rem;
        }

        .custom-text {
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .message-box p,
        .extra-box p {

            font-size: 1rem;
            line-height: 1.8;
        }
    }

</style>
```
