<head>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            font-family: 'Inter', sans-serif;

            background: #050505;
            color: white;

            overflow-x: hidden;
        }

        /* ---------------- HERO ---------------- */

        .hero {

            position: relative;

            height: 100vh;

            overflow: hidden;
        }

        /* ---------------- SLIDER ---------------- */

        .slider {

            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 0;
        }

        .slides {

            display: flex;

            width: 600vw;
            height: 100%;

            animation: slide 36s infinite ease-in-out;
        }

        .slides img {

            width: 100vw;
            height: 100vh;

            object-fit: cover;

            flex-shrink: 0;

            filter: brightness(0.72);
        }

        @keyframes slide {

            0%, 14% {
                transform: translateX(0);
            }

            18%, 32% {
                transform: translateX(-100vw);
            }

            36%, 50% {
                transform: translateX(-200vw);
            }

            54%, 68% {
                transform: translateX(-300vw);
            }

            72%, 86% {
                transform: translateX(-400vw);
            }

            90%, 100% {
                transform: translateX(-500vw);
            }
        }

        /* ---------------- OVERLAY ---------------- */

        .overlay {

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    rgba(0,0,0,0.18),
                    rgba(0,0,0,0.45)
                );

            z-index: 1;
        }

        /* ---------------- HERO CONTENT ---------------- */

        .hero-content {

            position: relative;

            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 20px;
        }

        h1 {

            font-size: clamp(4rem, 10vw, 8rem);

            font-weight: 700;

            letter-spacing: -4px;

            margin-bottom: 15px;

            text-shadow: 0 0 25px rgba(0,0,0,0.4);
        }

        .subtitle {

            color: #f3f4f6;

            font-size: 1rem;

            letter-spacing: 2px;

            margin-bottom: 35px;

            text-shadow: 0 0 12px rgba(0,0,0,0.4);
        }

        /* ---------------- TEXT BOX ---------------- */

        .custom-text {

            max-width: 700px;

            padding: 22px 30px;

            border-radius: 24px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.1);

            color: #f5f5f5;

            font-size: 1rem;

            line-height: 1.9;

            box-shadow: 0 0 40px rgba(0,0,0,0.25);
        }

        /* ---------------- SCROLL TEXT ---------------- */

        .scroll-text {

            position: absolute;

            bottom: 35px;

            color: rgba(255,255,255,0.85);

            font-size: 0.9rem;

            letter-spacing: 2px;

            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(8px);
            }
        }

        /* ---------------- SECTIONS ---------------- */

        .message-section,
        .extra-section {

            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 100px 25px;
        }

        .message-section {
            background: #050505;
        }

        .extra-section {
            background: #000;
        }

        .message-box,
        .extra-box {

            max-width: 900px;

            text-align: center;
        }

        .message-box h2,
        .extra-box h3 {

            font-size: clamp(2.5rem, 6vw, 5rem);

            margin-bottom: 30px;

            line-height: 1.1;

            letter-spacing: -2px;
        }

        .message-box p,
        .extra-box p {

            color: #b4b4b8;

            font-size: 1.1rem;

            line-height: 2;
        }

        /* ---------------- MOBILE ---------------- */

        @media (max-width: 900px) {

            h1 {
                font-size: 4rem;
            }

            .subtitle {
                font-size: 0.85rem;
            }

            .custom-text {

                font-size: 0.95rem;

                line-height: 1.7;
            }

            .message-box p,
            .extra-box p {

                font-size: 1rem;

                line-height: 1.8;
            }
        }

    </style>

</head>
